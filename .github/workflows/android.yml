name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Tools and Vcpkg Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential tar curl zip unzip pkg-config
          
          # Clonar e inicializar vcpkg de forma nativa en el servidor
          git clone https://github.com $HOME/vcpkg
          $HOME/vcpkg/bootstrap-vcpkg.sh

      - name: Compile Project via CMake using Vcpkg
        run: |
          mkdir build && cd build
          cmake .. \
            -DLIBERTY_RECOMP_PLATFORM=ANDROID \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_ROOT=$HOME/vcpkg
          make -j$(nproc)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibertyRecomp-AudioFixed
          path: build/*.apk
